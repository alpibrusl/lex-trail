[package]
name        = "lex-trail"
version     = "0.1.0"
description = "Content-addressed event log for A2A audit — append-only trail with SQLite and in-memory backends, attestation chains, and A2A task replay."

[dependencies]
# Self path-dependency so the `lex-trail/<module>` import form used by
# downstream consumers (and the examples below) resolves in-tree.
lex-trail = { path = "." }
